<section class="dashboard">
    <div class="profile">
        <img [src]="profileImage">
        <div>
            <h2>{{loggedInUser}}</h2>
            <p>{{role}}</p>
            <input [disabled]="!isActive"> 
            <input [value]="loggedInUser">
        </div>
    </div>
    <h1>Welcome {{loggedInUser}}</h1>
    <p>{{hospitalName}}</p>
    <div class="cards">
        <app-dashboard-card
            [title]="'Doctors'"
            [value]="doctorCount()"
            (refresh)="refreshDashboard()"> 
        </app-dashboard-card>
        <app-dashboard-card
            [title]="'Patients'"
            [value]="patientCount">
        </app-dashboard-card>
        <app-dashboard-card
            [title]="'Appointments'"
            [value]="appointmentCount">
        </app-dashboard-card>
        <app-dashboard-card
            [title]="'Revenue'"
            [value]="todayRevenue">
        </app-dashboard-card>
        <app-dashboard-card
            [title]="'Total Count'"
            [value]="totalPeople()">
        </app-dashboard-card>
    </div>
    <div class="actions">
        <button (click)="refreshDashboard()">
            Refresh Dashboard
        </button>
        <button (click)="addDoctor()">
            Add Doctor
        </button>
        <button (click)="resetDashboard()">
            Reset Dasboard
        </button>
    </div>
    <p>
        Last Updated: {{lastUpdated}}
    </p>
    <button (click)="logEvent($event)"></button>
</section>
