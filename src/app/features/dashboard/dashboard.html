<section class="Dashboard">
    <div class="profile">
        <img [src]="profileImage">
        <div>
            <h2>{{loggedInUser}}</h2>
            <p>{{role}}</p>
            <input [disabled]="!isActive"> 
            <input [value]="loggedInUser">
        </div>
    </div>
    <h1>Welcome {{loggedInUser}}</h1>
    <p>{{hospitalName}}</p>
    <div class="cards">
        <div class="card">
            <h3>Doctors Count</h3>
            <p>{{doctorCount}}</p>
        </div>
        <div class="card">
            <h3>Patients Count</h3>
            <p>{{patientCount}}</p>
        </div>
        <div class="card">
            <h3>Appointments Count</h3>
            <p>{{appointmentCount}}</p>
        </div>
        <div class="card">
            <h3>Revenue Count</h3>
            <p>{{todayRevenue}}</p>
        </div>
        <div class="card">
            <h3>Total People</h3>
            <p>{{patientCount+doctorCount}}</p>
        </div>
    </div>
</section>
