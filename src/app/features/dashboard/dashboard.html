<section class="dashboard">
    <div class="profile">
        <img [src]="hospitalService.profileImage">
        <div>
            <h2>{{hospitalService.loggedInUser}}</h2>
            <p>{{hospitalService.role}}</p>
            <input [disabled]="!hospitalService.isActive"> 
            <input #userNameInput [value]="hospitalService.loggedInUser">
        </div>
    </div>
    <h1>Welcome {{hospitalService.loggedInUser}}</h1>
    <p>{{hospitalService.hospitalName}}</p>
    <div class="cards">
        <app-dashboard-card
            [title]="'Doctors'"
            [value]="hospitalService.doctorCount()"
            (refresh)="hospitalService.refreshDashboard()"> 
        </app-dashboard-card>
        <app-dashboard-card
            [title]="'Patients'"
            [value]="hospitalService.patientCount()">
        </app-dashboard-card>
        <app-dashboard-card
            [title]="'Appointments'"
            [value]="hospitalService.appointmentCount()">
        </app-dashboard-card>
        <app-dashboard-card
            [title]="'Revenue'"
            [value]="hospitalService.todayRevenue()">
        </app-dashboard-card>
        <app-dashboard-card
            [title]="'Total Count'"
            [value]="hospitalService.totalPeople()">
        </app-dashboard-card>
    </div>
    <div class="actions">
        <button (click)="hospitalService.refreshDashboard()">
            Refresh Dashboard
        </button>
        <button (click)="hospitalService.addDoctor()">
            Add Doctor
        </button>
        <button (click)="hospitalService.resetDashboard()">
            Reset Dasboard
        </button>
    </div>
    <p>
        Last Updated: {{hospitalService.lastUpdated}}
    </p>
    <button (click)="logEvent($event)"></button>

    <div class="card">
        <p>{{hospitalService.hospitalStatus()}}</p>
    </div>
</section>
